name: Frontend CI

# Vercel gère les déploiements de prod et de preview automatiquement
# via son intégration GitHub. Ce workflow sert de garde-fou :
# vérifier que le build passe sur chaque PR avant le merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

jobs:
  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint (optionnel)
        run: npm run lint --if-present

      - name: Build
        env:
          # URL API factice suffisante pour compiler ; la vraie valeur est
          # injectée par Vercel via les Environment Variables.
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: npm run build
